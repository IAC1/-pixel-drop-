<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favourites | PixelDrop PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/50 px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-black tracking-wider bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
            PixelDrop<span class="text-xs text-pink-400 font-bold ml-1">FAVS</span>
        </a>
        <div class="flex items-center space-x-6 font-medium text-sm">
            <a href="index.html" class="text-slate-400 hover:text-white transition-all">Home</a>
            <a href="categories.html" class="text-slate-400 hover:text-white transition-all">Categories</a>
            <a href="favorites.html" class="text-pink-500 border-b-2 border-pink-500 pb-1">My Collection</a>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 py-16 flex flex-col md:flex-row justify-between items-center border-b border-slate-900 gap-6">
        <div>
            <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-2">Your Curated <span class="text-pink-500">Gallery</span></h1>
            <p class="text-slate-400 text-sm md:text-base">Artworks you've liked and saved across sessions. Saved locally in your browser.</p>
        </div>
        <button onclick="clearAllFavorites()" id="clearBtn" class="hidden bg-slate-900 hover:bg-red-950/40 hover:text-red-400 border border-slate-800 hover:border-red-900/50 px-5 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition-all">
            <i class="fas fa-trash-alt mr-2"></i> Clear All Saved
        </button>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 pb-32">
        <div id="favGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            </div>
    </main>

    <footer class="border-t border-slate-900 text-center py-6 text-xs text-slate-600">
        &copy; 2026 PixelDrop. Advanced LocalStorage Architecture.
    </footer>

    <script>
        // index.html এর মেইন ডেটাবেজের সাথে হুবহু মিল থাকতে হবে
        const galleryItems = [
            { id: 1, title: 'Cosmic Fluids', author: 'Elena Rostova', img: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=800' },
            { id: 2, title: 'Cyberpunk Alleyways', author: 'Kenji Sato', img: 'https://images.unsplash.com/photo-1533158326339-7f3cf2404354?q=80&w=800' },
            { id: 3, title: 'Mist Over Mountains', author: 'Marc Dubois', img: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=800' },
            { id: 4, title: 'Geometric Solitude', author: 'Sarah Jenkins', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800' },
            { id: 5, title: 'Neon Dreamscape', author: 'Elena Rostova', img: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=800' },
            { id: 6, title: 'Electric Dusk', author: 'Kenji Sato', img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=800' },
            { id: 7, title: 'Golden Hour Coast', author: 'Marc Dubois', img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=800' },
            { id: 8, title: 'Monochrome Echo', author: 'Sarah Jenkins', img: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=800' }
        ];

        function renderFavorites() {
            const grid = document.getElementById('favGrid');
            const clearBtn = document.getElementById('clearBtn');
            grid.innerHTML = '';
            
            // লুপ চালিয়ে চেক করা হচ্ছে কোন কোন আইডি ব্রাউজারে 'true' করা আছে
            const favItems = galleryItems.filter(item => localStorage.getItem(`liked-${item.id}`) === 'true');

            if (favItems.length === 0) {
                clearBtn.classList.add('hidden');
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20 text-slate-600 animate-fade-in">
                        <i class="far fa-heart text-6xl mb-4 text-slate-800"></i>
                        <h3 class="text-xl font-bold text-slate-400">Your collection is empty</h3>
                        <p class="text-sm text-slate-500 mt-1 mb-6">Go to the homepage and click the heart icon on any artwork!</p>
                        <a href="index.html" class="inline-block bg-white text-slate-950 px-6 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider shadow-lg hover:bg-pink-500 hover:text-white transition-all">Explore Home</a>
                    </div>
                `;
                return;
            }

            clearBtn.classList.remove('hidden');

            // ফেভারিট কার্ডগুলো জেনারেট করা
            favItems.forEach(item => {
                const card = document.createElement('div');
                card.className = "group overflow-hidden rounded-2xl bg-slate-900/50 border border-slate-800/80 shadow-xl transition-all duration-300";
                card.innerHTML = `
                    <div class="overflow-hidden aspect-[4/3]">
                        <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </div>
                    <div class="p-5 flex justify-between items-center bg-slate-950/40">
                        <div>
                            <h3 class="text-sm font-bold text-slate-200 line-clamp-1">${item.title}</h3>
                            <p class="text-xs text-slate-500">By ${item.author}</p>
                        </div>
                        <button onclick="removeFavorite(${item.id})" class="text-slate-500 hover:text-red-500 transition-colors text-sm" title="Remove from Favorites">
                            <i class="fas fa-heart-broken"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // একটা একটা করে রিমুভ করার ফাংশন
        function removeFavorite(id) {
            localStorage.removeItem(`liked-${id}`);
            renderFavorites(); // রিমুভ করার সাথে সাথে পেজ রিলোড ছাড়া গ্যালারি আপডেট হবে
        }

        // সব একসাথে ক্লিয়ার করার ফাংশন
        function clearAllFavorites() {
            if(confirm("Are you sure you want to clear your entire collection?")) {
                galleryItems.forEach(item => localStorage.removeItem(`liked-${item.id}`));
                renderFavorites();
            }
        }

        // পেজ লোড হলে ফাংশনটি রান করবে
        window.onload = renderFavorites;
    </script>
</body>
</html>
