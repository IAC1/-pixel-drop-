<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelDrop // Future Tokyo V5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* === Core Cyber Variables === */
        :root {
            --bg-dark: #050505;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007c;
            --neon-purple: #b026ff;
            --panel-bg: rgba(10, 10, 15, 0.8);
            --text-main: #ffffff;
            --text-dim: #8b8b99;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Animated Grid Background */
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-attachment: fixed;
        }

        /* Glowing Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

        /* === Loader === */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-top-color: var(--neon-cyan);
            border-bottom-color: var(--neon-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* === Header === */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .brand span { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }

        .search-box {
            padding: 10px 20px;
            width: 300px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: white;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255,0,124,0.3); }

        /* === Hero Section with Glitch Effect === */
        .hero {
            padding: 160px 20px 80px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Glitch Title Animation */
        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .glitch-title span { color: var(--neon-pink); }
        
        .hero p {
            color: var(--text-dim);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .cyber-badge {
            display: inline-block;
            padding: 8px 20px;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 5px rgba(0, 243, 255, 0.1); }
            100% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
        }

        /* === Premium Masonry Gallery === */
        .gallery {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 30px 100px;
            column-count: 4;
            column-gap: 20px;
        }

        .item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #111;
            /* Scroll Animation Defaults */
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        /* This class is added by JS when scrolling */
        .item.show {
            opacity: 1;
            transform: translateY(0);
        }

        .item img {
            width: 100%;
            display: block;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            opacity: 0;
            transition: 0.4s ease;
        }

        .item:hover img { transform: scale(1.08); }
        .item:hover .overlay { opacity: 1; }

        .overlay h3 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin-bottom: 5px; color: #fff; }
        .overlay p { color: var(--neon-cyan); font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; }

        /* Responsive */
        @media (max-width: 1200px) { .gallery { column-count: 3; } }
        @media (max-width: 800px) { .gallery { column-count: 2; } .glitch-title { font-size: 3rem; } .search-box { display: none; } header { padding: 15px 20px; } }
        @media (max-width: 500px) { .gallery { column-count: 1; } }

    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <header>
        <div class="brand">PIXEL<span>DROP</span></div>
        <input type="text" class="search-box" placeholder="Search Neo-Tokyo Coordinates...">
    </header>

    <section class="hero">
        <h1 class="glitch-title">TOKYO <span>FUTURE</span> V5.0</h1>
        <p>Advanced neural network image rendering. Experiencing the highest grade of Cyberpunk aesthetics without lag.</p>
        <div class="cyber-badge">SYSTEM OPTIMIZED // 60FPS</div>
    </section>

    <main class="gallery" id="gallery-container">
        </main>

    <script>
        // Array of 20 Premium Cyberpunk / Neo-Tokyo Images
        const images = [
            { src: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=800&q=80", title: "Shibuya Neon", tag: "DISTRICT 1" },
            { src: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80", title: "Night Runner", tag: "CORE CITY" },
            { src: "https://images.unsplash.com/photo-1554797589-7241bb691973?auto=format&fit=crop&w=800&q=80", title: "Alley Glow", tag: "YOKOCHO" },
            { src: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=800&q=80", title: "Rain Matrix", tag: "SECTOR 7" },
            { src: "https://images.unsplash.com/photo-1513407030348-c6e4286bb980?auto=format&fit=crop&w=800&q=80", title: "Midnight Drive", tag: "HIGHWAY" },
            { src: "https://images.unsplash.com/photo-1601042879364-f3947d3f9c16?auto=format&fit=crop&w=800&q=80", title: "Kabukicho", tag: "RED LIGHT" },
            { src: "https://images.unsplash.com/photo-1524311583145-d5593bd6fa87?auto=format&fit=crop&w=800&q=80", title: "Skyline Node", tag: "ELEVATED" },
            { src: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80", title: "Tokyo Tower", tag: "BEACON" },
            { src: "https://images.unsplash.com/photo-1570168007204-dfb528c6958f?auto=format&fit=crop&w=800&q=80", title: "Synthwave", tag: "DOWNTOWN" },
            { src: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80", title: "Speed Lines", tag: "TRANSIT" },
            { src: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80", title: "Arcade Tech", tag: "AKIHABARA" },
            { src: "https://images.unsplash.com/photo-1557404763-69708cd8b9ce?auto=format&fit=crop&w=800&q=80", title: "Glitch Hub", tag: "VENDOR" },
            { src: "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=800&q=80", title: "Mega City", tag: "METROPOLIS" },
            { src: "https://images.unsplash.com/photo-1496568818309-53d7c7753022?auto=format&fit=crop&w=800&q=80", title: "Deep Subway", tag: "UNDERGROUND" },
            { src: "https://images.unsplash.com/photo-1519999482648-25049ddd37b1?auto=format&fit=crop&w=800&q=80", title: "Quantum Orbit", tag: "SATELLITE" },
            { src: "https://images.unsplash.com/photo-1563207153-f4047805126f?auto=format&fit=crop&w=800&q=80", title: "Vapor Rain", tag: "ACID RAIN" },
            { src: "https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?auto=format&fit=crop&w=800&q=80", title: "Grid Sync", tag: "NETWORK" },
            { src: "https://images.unsplash.com/photo-1580136608260-4eb11f4b24fe?auto=format&fit=crop&w=800&q=80", title: "Neon Signage", tag: "COMMERCIAL" },
            { src: "https://images.unsplash.com/photo-1524748969064-cf3dabd7b84d?auto=format&fit=crop&w=800&q=80", title: "Cyber Alley", tag: "BACKSTREET" },
            { src: "https://images.unsplash.com/photo-1560052824-33230a133481?auto=format&fit=crop&w=800&q=80", title: "Wet Streets", tag: "REFLECTIONS" }
        ];

        const gallery = document.getElementById('gallery-container');

        // Dynamically inject images with loading="lazy" for ultra performance
        images.forEach((imgData) => {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <img src="${imgData.src}" alt="${imgData.title}" loading="lazy">
                <div class="overlay">
                    <p>// ${imgData.tag}</p>
                    <h3>${imgData.title}</h3>
                </div>
            `;
            gallery.appendChild(item);
        });

        // Advanced Intersection Observer for Scroll Animations
        // This ensures the images "fade in and float up" only when they appear on screen
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show'); // Triggers the CSS animation
                    observer.unobserve(entry.target); // Stops observing once loaded
                }
            });
        }, observerOptions);

        // Start observing all items once the page loads
        window.addEventListener('load', () => {
            // Remove Loader smoothly
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.visibility = 'hidden';
                
                // Start Scroll Animations
                document.querySelectorAll('.item').forEach(item => {
                    observer.observe(item);
                });
            }, 500);
        });
    </script>
</body>
</html>
