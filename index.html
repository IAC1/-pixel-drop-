<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelDrop // 2026 Edition V8.0</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* === 2026 Next-Gen Variables === */
        :root {
            --bg-deep: #050507;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007c;
            --neon-purple: #8a2be2;
            --glass-bg: rgba(20, 20, 25, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f4f8;
            --text-dim: #9ba4b5;
            --heart-active: #ff2a5f;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Removes blue tap highlight on mobile */
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Ambient Glowing Background Effect (2026 Trend) */
        body::before, body::after {
            content: ''; position: fixed; width: 300px; height: 300px;
            border-radius: 50%; filter: blur(150px); z-index: -1; opacity: 0.5;
        }
        body::before { top: -100px; left: -100px; background: var(--neon-purple); }
        body::after { bottom: -100px; right: -100px; background: var(--neon-cyan); }

        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--neon-cyan), var(--neon-pink)); border-radius: 10px; }

        /* === Header (Glassmorphism) === */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(5, 5, 7, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 20px; text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900;
            color: #fff; letter-spacing: 2px; text-transform: uppercase;
        }
        .logo span {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 124, 0.4);
        }

        /* === Hero Section === */
        .hero {
            padding: 140px 20px 60px; text-align: center; max-width: 800px; margin: 0 auto;
        }
        .hero .version-tag {
            display: inline-block; padding: 6px 15px; margin-bottom: 20px;
            border-radius: 50px; background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
            font-family: 'Space Mono', monospace; font-size: 0.85rem; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .hero h2 { font-size: 1.5rem; font-weight: 600; color: var(--text-dim); margin-bottom: 10px; }

        /* === 2026 CSS Grid Layout (Perfect for Mobile & Desktop) === */
        .gallery-container {
            display: grid;
            /* Auto-fit creates a responsive grid without breaking cards */
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 0 30px 100px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* === Premium Glass Cards === */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
            opacity: 0; transform: translateY(40px); /* For scroll animation */
        }

        .card.show { opacity: 1; transform: translateY(0); }
        .card:hover { 
            transform: translateY(-10px); 
            border-color: rgba(255, 0, 124, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 0, 124, 0.2);
        }

        .card-img { position: relative; width: 100%; height: 350px; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .card:hover .card-img img { transform: scale(1.08); }

        /* Like Button 2026 Style */
        .like-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 30px; padding: 8px 15px;
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease; z-index: 10;
        }
        .like-btn:hover { background: rgba(20, 20, 20, 0.8); border-color: rgba(255,255,255,0.3); }
        
        .heart-icon { color: #fff; font-size: 1.1rem; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s; }
        .like-count { color: #fff; font-family: 'Space Mono', monospace; font-size: 0.95rem; font-weight: 700; }

        /* Active Heart Animation */
        .like-btn.active { border-color: var(--heart-active); background: rgba(255, 42, 95, 0.1); }
        .like-btn.active .heart-icon { color: var(--heart-active); transform: scale(1.2); text-shadow: 0 0 10px var(--heart-active); }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1.2); } }
        .like-btn.active .heart-icon { animation: pop 0.4s forwards; }

        /* Card Content */
        .card-info { padding: 25px; }
        .card-info h3 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #fff; margin-bottom: 8px; letter-spacing: 1px; }
        .card-info .sys-data { font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--neon-cyan); opacity: 0.8; }

        /* === Footer 2026 === */
        footer {
            text-align: center; padding: 40px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.5);
            font-family: 'Space Mono', monospace; color: var(--text-dim);
        }
        footer span { color: var(--neon-pink); }

        /* Mobile Fixes */
        @media (max-width: 768px) {
            .gallery-container { grid-template-columns: 1fr; padding: 0 20px 80px; }
            .card-img { height: 280px; } /* Slightly shorter images on mobile */
            header { padding: 15px; }
            .logo { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TOKYO <span>VISUALS</span></div>
    </header>

    <section class="hero">
        <div class="version-tag">/// SYSTEM BUILD: 2026.V8 ///</div>
        <h2>NEXT-GEN CYBERPUNK ARCHIVE</h2>
        <p style="color: var(--text-dim);">Neural-synced high-resolution aesthetic modules. Tap the heart to upload preference to the mainframe.</p>
    </section>

    <main class="gallery-container" id="gallery">
        </main>

    <footer>
        <p>&copy; 2026 NEURON_LINK. ALL RIGHTS RESERVED.</p>
        <p style="font-size: 0.8rem; margin-top: 10px;">SECURE CONNECTION ESTABLISHED <span>●</span></p>
    </footer>

    <script>
        // Elite 2026 Tokyo Image Database
        const tokyoData = [
            { id: 1, src: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=800", title: "SHIBUYA_OVERRIDE", data: "NODE_77 // UPLINK: STABLE", likes: 2450 },
            { id: 2, src: "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=800", title: "NIGHT_RUNNER", data: "SECTOR_4 // ENCRYPTED", likes: 1820 },
            { id: 3, src: "https://images.unsplash.com/photo-1554797589-7241bb691973?w=800", title: "NEON_ALLEY", data: "YOKOCHO // LOW_LATENCY", likes: 3105 },
            { id: 4, src: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=800", title: "ACID_RAIN", data: "CORE_SYSTEM // SYNCING", likes: 984 },
            { id: 5, src: "https://images.unsplash.com/photo-1601042879364-f3947d3f9c16?w=800", title: "KABUKICHO_X", data: "DISTRICT_9 // ONLINE", likes: 4200 },
            { id: 6, src: "https://images.unsplash.com/photo-1524311583145-d5593bd6fa87?w=800", title: "SKY_NODE", data: "ELEVATED // PING: 2ms", likes: 1560 },
            { id: 7, src: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800", title: "TOWER_BEACON", data: "TRANSMITTER_01 // LIVE", likes: 2230 },
            { id: 8, src: "https://images.unsplash.com/photo-1570168007204-dfb528c6958f?w=800", title: "SYNTH_DOWNTOWN", data: "GRID_ACCESS // GRANTED", likes: 3890 },
            { id: 9, src: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800", title: "AKIHABARA_TECH", data: "HARDWARE_HUB // ACTIVE", likes: 5120 },
            { id: 10, src: "https://images.unsplash.com/photo-1557404763-69708cd8b9ce?w=800", title: "GLITCH_MARKET", data: "BLACK_MARKET // HIDDEN", likes: 2750 }
        ];

        const gallery = document.getElementById('gallery');

        // Function to format numbers (e.g., 2450 -> 2.4K)
        const formatLikes = (num) => {
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        };

        // Render Cards
        tokyoData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-img">
                    <img src="${item.src}" loading="lazy" alt="${item.title}">
                    <div class="like-btn" onclick="toggleLike(this, ${item.likes})">
                        <i class="fa-solid fa-heart heart-icon"></i>
                        <span class="like-count" data-base="${item.likes}">${formatLikes(item.likes)}</span>
                    </div>
                </div>
                <div class="card-info">
                    <h3>${item.title}</h3>
                    <div class="sys-data">> ${item.data}</div>
                </div>
            `;
            gallery.appendChild(card);
        });

        // 2026 Like Button Logic
        function toggleLike(element, baseLikes) {
            const isLiked = element.classList.contains('active');
            const countSpan = element.querySelector('.like-count');
            
            if (isLiked) {
                element.classList.remove('active');
                countSpan.innerText = formatLikes(baseLikes); // Revert to base
            } else {
                element.classList.add('active');
                countSpan.innerText = formatLikes(baseLikes + 1); // Add 1 like
            }
            
            // Add a tiny haptic feedback simulation for mobile devices
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Smooth Scroll Reveal Animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                    observer.unobserve(entry.target); // Play animation only once
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.card').forEach(card => observer.observe(card));
    </script>
</body>
</html>
