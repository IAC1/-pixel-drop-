<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKYO 2026 // GOD TIER PORTAL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           [1] GOD TIER VARIABLES & THEMES
           ========================================================================== */
        :root[data-theme="dark"] {
            --bg-base: #050507;
            --bg-surface: #0a0a0f;
            --bg-glass: rgba(10, 10, 15, 0.85);
            --border-glass: rgba(0, 243, 255, 0.15);
            --text-main: #ffffff;
            --text-dim: #8b9eb3;
            --accent-cyan: #00f3ff;
            --accent-pink: #ff0055;
            --accent-red: #ff2a2a;
            --glow-cyan: 0 0 15px rgba(0, 243, 255, 0.4);
            --glow-pink: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        :root[data-theme="light"] {
            --bg-base: #f0f2f5;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.9);
            --border-glass: rgba(0, 0, 0, 0.1);
            --text-main: #111111;
            --text-dim: #555555;
            --accent-cyan: #0055ff;
            --accent-pink: #e6004c;
            --accent-red: #cc0000;
            --glow-cyan: 0 5px 15px rgba(0, 85, 255, 0.2);
            --glow-pink: 0 5px 15px rgba(230, 0, 76, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-base); 
            color: var(--text-main);
            overflow-x: hidden; 
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.05) 0%, transparent 70%);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }

        /* ==========================================================================
           [2] NAVIGATION HEADER & INSTAGRAM
           ========================================================================== */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; z-index: 5000;
        }

        .brand-text { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 4px; color: var(--text-main); }
        .brand-text span { color: var(--accent-cyan); text-shadow: var(--glow-cyan); }

        .ig-link {
            font-family: 'Space Mono', monospace; font-size: 1rem; font-weight: bold;
            color: var(--accent-pink); text-decoration: none; display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; border: 1px solid var(--accent-pink); border-radius: 20px;
            transition: 0.3s; background: rgba(255,0,85,0.05);
        }
        .ig-link:hover { background: var(--accent-pink); color: #fff; box-shadow: var(--glow-pink); }

        .sys-controls { display: flex; gap: 15px; }
        .icon-btn {
            width: 45px; height: 45px; border-radius: 10px; background: rgba(128,128,128,0.1);
            border: 1px solid var(--border-glass); color: var(--text-main);
            display: flex; justify-content: center; align-items: center; font-size: 1.2rem;
            cursor: pointer; transition: 0.2s;
        }
        .icon-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); transform: translateY(-2px); box-shadow: var(--glow-cyan); }

        /* ==========================================================================
           [3] CONTROL PANEL
           ========================================================================== */
        .control-panel { margin: 120px auto 30px; max-width: 1600px; padding: 0 40px; text-align: center; }
        .title-sub { font-family: 'Space Mono', monospace; color: var(--text-dim); margin-bottom: 20px; font-size: 0.9rem; }

        /* ==========================================================================
           [4] HIGH PERFORMANCE MASONRY GRID
           ========================================================================== */
        .mainframe { max-width: 1800px; margin: 0 auto; padding: 0 40px 100px; }
        
        .masonry-grid { column-count: 4; column-gap: 20px; width: 100%; }
        @media (max-width: 1400px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 900px) { .masonry-grid { column-count: 2; column-gap: 15px; } }
        @media (max-width: 600px) { .masonry-grid { column-count: 1; } }

        .data-node {
            break-inside: avoid; margin-bottom: 20px;
            background: var(--bg-surface); border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border-glass); position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .data-node:hover { transform: translateY(-5px); box-shadow: var(--glow-cyan); border-color: var(--accent-cyan); }

        .img-container { position: relative; width: 100%; cursor: pointer; background: rgba(128,128,128,0.1); min-height: 200px; }
        .img-container img { width: 100%; display: block; filter: brightness(0.9); transition: filter 0.3s; }
        .data-node:hover .img-container img { filter: brightness(1.1); }

        .action-layer { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 10; opacity: 0; transition: 0.2s; }
        .data-node:hover .action-layer { opacity: 1; }
        
        .action-circle { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; color: #fff; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .action-circle:hover { background: var(--accent-pink); border-color: var(--accent-pink); color: #fff; }

        /* ==========================================================================
           [5] LIGHTBOX
           ========================================================================== */
        #lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            z-index: 100000; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        #lightbox.active { opacity: 1; pointer-events: auto; }
        
        .lb-close { position: absolute; top: 30px; right: 30px; width: 45px; height: 45px; background: rgba(255,0,85,0.1); border: 1px solid var(--accent-pink); color: var(--accent-pink); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .lb-close:hover { background: var(--accent-pink); color: #fff; }
        #lb-img { max-width: 90vw; max-height: 90vh; border-radius: 8px; object-fit: contain; }

        /* ==========================================================================
           [6] TON COFFEE BUTTON & TOASTS
           ========================================================================== */
        .ton-footer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 4000; }
        .ton-btn-red {
            background: rgba(255, 42, 42, 0.1); backdrop-filter: blur(10px);
            border: 1px solid var(--accent-red); padding: 10px 24px; border-radius: 30px;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            color: var(--accent-red); font-family: 'Space Mono', monospace; font-size: 0.9rem; font-weight: bold;
            transition: 0.2s;
        }
        .ton-btn-red:hover { background: var(--accent-red); color: #fff; transform: translateY(-3px); }

        #toast-box { position: fixed; bottom: 80px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-msg { background: var(--bg-glass); border-left: 4px solid var(--accent-cyan); color: var(--text-main); padding: 15px 20px; border-radius: 6px; font-family: 'Space Mono', monospace; font-size: 0.9rem; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); opacity: 0; transform: translateX(50px); transition: 0.3s; }
        .toast-msg.show { opacity: 1; transform: translateX(0); }

        .loader { text-align: center; padding: 30px 0; font-family: 'Orbitron', sans-serif; color: var(--accent-cyan); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="brand-text">TOKYO<span>_2026</span></div>
        <a href="https://instagram.com/i_f_t_uu" target="_blank" class="ig-link">
            <i class="fab fa-instagram"></i> i_f_t_uu
        </a>
        <div class="sys-controls">
            <button class="icon-btn" onclick="toggleTheme()" title="Settings / Dark-Light Mode"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" onclick="window.scrollTo(0,0)" title="Go Top"><i class="fas fa-arrow-up"></i></button>
        </div>
    </header>

    <section class="control-panel">
        <div class="title-sub">>> GENERATING 500+ ULTRA-HD FUTURE TOKYO ASSETS</div>
    </section>

    <main class="mainframe">
        <div class="masonry-grid" id="data-grid"></div>
        <div class="loader" id="loader"><i class="fas fa-circle-notch fa-spin"></i> SYNCING NEURAL DATA...</div>
    </main>

    <div id="lightbox">
        <div class="lb-close" onclick="closeLB()"><i class="fas fa-times"></i></div>
        <img id="lb-img" src="" alt="Full Preview">
    </div>

    <div class="ton-footer">
        <button class="ton-btn-red" onclick="copyWallet()">
            <i class="fas fa-coffee"></i> GIFT COFFEE (TON)
        </button>
    </div>

    <div id="toast-box"></div>

    <script>
        /* --- 1. CORE LOGIC --- */
        let imageCount = 0;
        const maxImages = 500;
        const batchSize = 12; // Loading 12 at a time for crazy fast speed
        const grid = document.getElementById('data-grid');
        const loader = document.getElementById('loader');

        /* --- 2. FAST IMAGE GENERATOR (LAZY LOADED) --- */
        function loadImages(count) {
            if (imageCount >= maxImages) {
                loader.innerText = "ALL 500 ASSETS LOADED SUCCESSFULLY.";
                return;
            }
            
            for (let i = 0; i < count; i++) {
                if (imageCount >= maxImages) break;
                
                // Using Pollinations AI for free, fast, unlimited futuristic Tokyo images
                const seed = Math.floor(Math.random() * 1000000);
                const randomHeight = Math.floor(Math.random() * (800 - 500 + 1) + 500);
                const imgUrl = `https://image.pollinations.ai/prompt/cyberpunk%20tokyo%20future%20neon%20cityscape%20cinematic?width=600&height=${randomHeight}&nologo=true&seed=${seed}`;

                const node = document.createElement('div');
                node.className = 'data-node';
                node.innerHTML = `
                    <div class="img-container" onclick="openLB('${imgUrl}')">
                        <img src="${imgUrl}" loading="lazy" alt="Tokyo Asset ${imageCount}">
                        <div class="action-layer">
                            <div class="action-circle" onclick="event.stopPropagation(); showToast('Added to favorites!', 'success')"><i class="fas fa-heart"></i></div>
                        </div>
                    </div>
                `;
                grid.appendChild(node);
                imageCount++;
            }
        }

        /* --- 3. INFINITE SCROLL (For 500+ Images) --- */
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
                loadImages(batchSize);
            }
        });

        // Initial Load
        loadImages(16);

        /* --- 4. LIGHTBOX PREVIEW --- */
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lb-img');

        function openLB(src) {
            lbImg.src = src;
            lightbox.classList.add('active');
        }
        function closeLB() {
            lightbox.classList.remove('active');
            lbImg.src = "";
        }

        /* --- 5. THEME TOGGLE (DARK/LIGHT) --- */
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            
            const themeIcon = document.querySelector('button[onclick="toggleTheme()"] i');
            themeIcon.className = newTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            
            showToast(`${newTheme.toUpperCase()} Mode Activated`);
        }

        /* --- 6. TON WALLET COPY --- */
        const tonWallet = "UQCvCMmfwJugAgxbMjmUrHI4goe2boXykQwNCDOWcwi8_fGT";
        
        function copyWallet() {
            navigator.clipboard.writeText(tonWallet).then(() => {
                showToast("TON Address Copied! Thanks for the coffee!", "success");
            }).catch(err => {
                showToast("Failed to copy address.", "error");
            });
        }

        /* --- 7. TOAST NOTIFICATION SYSTEM --- */
        const toastBox = document.getElementById('toast-box');
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = msg;
            toastBox.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
