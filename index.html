<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelDrop // Enhanced Tokyo V7.0</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* === Ultimate CSS Variables V7 === */
        :root {
            --primary-color: #0f111a;
            --secondary-color: #f7f9fc;
            --accent-color: #ff2a7c; /* Neon Pink Highlight */
            --heart-color: #ff3366;   /* Vibrant Heart Color */
            --text-color: #e0e6f1;
            --bg-color: #0c0d16;
            --font-family-title: 'Orbitron', sans-serif;
            --font-family-base: 'Rajdhani', sans-serif;
            --font-family-mono: 'Share Tech Mono', monospace;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            cursor: none; /* Custom Neo-Tokyo Cursor */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family-base);
            margin: 0; padding: 0; display: flex; flex-direction: column;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Animated Grid Background */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1; opacity: 0.3;
        }

        /* Glowing Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--heart-color); }

        /* Custom Cursor */
        .cursor-dot { width: 6px; height: 6px; background: var(--accent-color); position: fixed; border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%, -50%); }
        .cursor-outline { width: 35px; height: 35px; border: 2px solid #00f3ff; position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: 0.1s ease; }

        /* === Header === */
        header {
            background: rgba(12, 13, 22, 0.95);
            backdrop-filter: blur(10px);
            color: var(--secondary-color);
            padding: 30px 50px; text-align: center;
            position: fixed; top: 0; width: 100%; z-index: 1000;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(255, 42, 124, 0.3);
        }

        header h1 {
            font-family: var(--font-family-title);
            font-size: 3.5rem; font-weight: 900; margin: 0;
            letter-spacing: 3px; text-transform: uppercase;
            color: #fff; text-shadow: 0 0 15px #fff, 0 0 30px var(--accent-color);
        }
        header h1 span { color: #00f3ff; text-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff; }

        /* === Hero Section with Live Stats === */
        .hero {
            padding: 160px 20px 80px; text-align: center; max-width: 900px; margin: 0 auto;
        }
        .hero h2 { font-family: var(--font-family-mono); color: var(--accent-color); font-size: 1.5rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .hero p { color: var(--text-color); font-size: 1.2rem; margin-bottom: 40px; }
        .sys-badge { display: inline-block; padding: 10px 25px; border: 1px dashed #00f3ff; color: #00f3ff; font-family: var(--font-family-mono); background: rgba(0, 243, 255, 0.08); font-size: 0.9rem; letter-spacing: 1.5px; animation: glow 2s infinite alternate; }

        @keyframes glow { 0% { box-shadow: 0 0 5px rgba(0, 243, 255, 0.1); } 100% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); } }

        /* === High-Resolution Gallery V7 === */
        .gallery-wrapper { max-width: 1500px; margin: 0 auto; padding: 0 50px 100px; column-count: 4; column-gap: 30px; }

        .card {
            background-color: var(--primary-color);
            border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative; margin-bottom: 30px; break-inside: avoid;
            opacity: 0; transform: translateY(50px);
        }
        .card.show { opacity: 1; transform: translateY(0); }

        .card:hover { transform: translateY(-10px); border-color: var(--accent-color); box-shadow: 0 15px 40px rgba(255, 42, 124, 0.4); }

        .card .img-container { height: 280px; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Interactive Heart (Like) Icon */
        .card .heart-container { position: absolute; bottom: 15px; right: 15px; z-index: 5; }
        .card .heart-icon { font-size: 1.8rem; color: #fff; cursor: none; transition: color 0.3s, transform 0.3s ease; }
        .card .heart-icon:hover { color: var(--heart-color); transform: scale(1.3); }
        .card .heart-icon.liked { color: var(--heart-color); transform: scale(1.3); text-shadow: 0 0 15px var(--heart-color); }
        
        .card .like-count { font-size: 1.1rem; color: #fff; margin-left: 8px; font-family: var(--font-family-mono); font-weight: 700; }

        .card-content { padding: 25px; }
        .card-content h3 { font-family: var(--font-family-title); font-size: 1.4rem; margin: 0 0 10px; color: #fff; text-transform: uppercase; }
        .card-content p { font-size: 0.95rem; line-height: 1.6; color: #a0a6b1; }

        /* Interactive Footer with Live Text */
        footer { background: #050505; border-top: 2px solid var(--heart-color); padding: 50px 40px; text-align: center; }
        footer p { font-family: var(--font-family-mono); color: var(--heart-color); text-transform: uppercase; letter-spacing: 2px; }
        
        /* Responsive Adaptation */
        @media (max-width: 1200px) { .gallery-wrapper { column-count: 3; } header h1 { font-size: 2.8rem; } }
        @media (max-width: 800px) { .gallery-wrapper { column-count: 2; padding: 0 20px 80px; } header { padding: 20px; } header h1 { font-size: 2.2rem; } .hero h2 { font-size: 1.2rem; } }
        @media (max-width: 500px) { .gallery-wrapper { column-count: 1; } }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-outline" id="cursorOutline"></div>

    <header>
        <h1>TOKYO <span>VISUALS</span> V7.0</h1>
    </header>

    <section class="hero">
        <h2>>> ACCESSING GLOBAL MAIN_FRAME... [OK]</h2>
        <p>A curated collection of hyper-resolution cityscapes and cyberpunk aesthetics from the central Neo-Tokyo databank.</p>
        <div class="sys-badge">> ACTIVE NODES: 2077 // SYNC STATUS: SECURE</div>
    </section>

    <main class="gallery-wrapper" id="gallery-container">
        </main>

    <footer>
        <p>&copy; 2024 NEURON_LINK. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        // 1. Custom Cursor Logic V7
        const dot = document.getElementById('cursorDot');
        const outline = document.getElementById('cursorOutline');
        window.addEventListener('mousemove', (e) => {
            dot.style.left = `${e.clientX}px`; dot.style.top = `${e.clientY}px`;
            setTimeout(() => {
                outline.style.left = `${e.clientX}px`; outline.style.top = `${e.clientY}px`;
            }, 50);
        });

        // 2. Premium Tokyo Images Array (12 high-res Tokyo cards added)
        const images = [
            { src: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=800", title: "Shibuya Rain", tag: "SYS_01", likes: "1.2K" },
            { src: "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=800", title: "Matrix Run", tag: "SYS_02", likes: "980" },
            { src: "https://images.unsplash.com/photo-1554797589-7241bb691973?w=800", title: "Alley Glow", tag: "SYS_03", likes: "1.5K" },
            { src: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=800", title: "Sevens Rain", tag: "SYS_04", likes: "1.1K" },
            { src: "https://images.unsplash.com/photo-1513407030348-c6e4286bb980?w=800", title: "Speed Loop", tag: "SYS_05", likes: "850" },
            { src: "https://images.unsplash.com/photo-1601042879364-f3947d3f9c16?w=800", title: "Red Lanterns", tag: "SYS_06", likes: "999" },
            { src: "https://images.unsplash.com/photo-1524311583145-d5593bd6fa87?w=800", title: "Sky Node", tag: "SYS_07", likes: "1.3K" },
            { src: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800", title: "Tower Beacon", tag: "SYS_08", likes: "760" },
            { src: "https://images.unsplash.com/photo-1570168007204-dfb528c6958f?w=800", title: "Synth Downtown", tag: "SYS_09", likes: "1.8K" },
            { src: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800", title: "Transit Grid", tag: "SYS_10", likes: "650" },
            { src: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800", title: "Akihabara Tech", tag: "SYS_11", likes: "2.1K" },
            { src: "https://images.unsplash.com/photo-1557404763-69708cd8b9ce?w=800", title: "Glitch Hub", tag: "SYS_12", likes: "1.2K" }
        ];

        const gallery = document.getElementById('gallery-container');
        images.forEach(img => {
            const el = document.createElement('div'); el.className = 'card';
            el.innerHTML = `
                <div class="img-container">
                    <img src="${img.src}" loading="lazy" alt="${img.title}">
                    <div class="heart-container">
                        <i class="fas fa-heart heart-icon"></i>
                        <span class="like-count">${img.likes}</span>
                    </div>
                </div>
                <div class="card-content">
                    <h3>${img.title}</h3>
                    <p>// ${img.tag} // ACCESS STATUS: GRANTED // NEURAL LINK: ESTABLISHED</p>
                </div>
            `;
            gallery.appendChild(el);
        });

        // 3. Scroll Animation (Fade In V7)
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('show'); observer.unobserve(entry.target); } });
        }, observerOptions);
        document.querySelectorAll('.card').forEach(card => observer.observe(card));

        // 4. Interactive Heart (Like) V7
        const hearts = document.querySelectorAll('.heart-icon');
        hearts.forEach(heart => {
            heart.addEventListener('click', function() { this.classList.toggle('liked'); });
        });
    </script>
</body>
</html>
