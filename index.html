<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKYO 2026 // ULTRA PORTAL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           [1] SYSTEM VARIABLES & THEME ENGINE
           ========================================================================== */
        :root[data-theme="dark"] {
            --bg-base: #050507;
            --bg-surface: #0a0a0f;
            --bg-glass: rgba(10, 10, 15, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #8b949e;
            --accent-cyan: #00f3ff;
            --accent-pink: #ff0055;
            --accent-red: #ff3333;
            --glow-cyan: 0 0 20px rgba(0, 243, 255, 0.4);
            --glow-pink: 0 0 20px rgba(255, 0, 85, 0.4);
            --glow-red: 0 0 15px rgba(255, 51, 51, 0.5);
        }

        :root[data-theme="light"] {
            --bg-base: #f0f2f5;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --border-glass: rgba(0, 0, 0, 0.1);
            --text-main: #0f0f14;
            --text-dim: #5c6bc0;
            --accent-cyan: #0099ff;
            --accent-pink: #e6004c;
            --accent-red: #d90000;
            --glow-cyan: 0 4px 15px rgba(0, 153, 255, 0.3);
            --glow-pink: 0 4px 15px rgba(230, 0, 76, 0.3);
            --glow-red: 0 4px 15px rgba(217, 0, 0, 0.3);
        }

        /* ==========================================================================
           [2] RESET & GLOBAL ARCHITECTURE
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-base); color: var(--text-main);
            overflow-x: hidden; transition: background-color 0.5s ease, color 0.5s ease;
            cursor: none; /* Custom Cursor enabled */
        }

        /* Sleek Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--accent-cyan), var(--accent-pink)); border-radius: 10px; }

        a { text-decoration: none; color: inherit; }
        button { border: none; background: none; cursor: pointer; outline: none; }

        /* ==========================================================================
           [3] CUSTOM CURSOR (2026 UI)
           ========================================================================== */
        .cursor-dot { width: 8px; height: 8px; background: var(--accent-cyan); position: fixed; border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, background 0.2s; }
        .cursor-ring { width: 30px; height: 30px; border: 1px solid var(--accent-pink); position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, border-color 0.2s; transition-timing-function: ease-out; }
        
        body.light-mode .cursor-dot { background: var(--accent-pink); }
        body.light-mode .cursor-ring { border-color: var(--accent-cyan); }

        /* ==========================================================================
           [4] PRELOADER SYSTEM
           ========================================================================== */
        #boot-screen {
            position: fixed; inset: 0; background: var(--bg-base); z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        .boot-logo { font-family: 'Orbitron', sans-serif; font-size: 3rem; color: var(--accent-cyan); text-shadow: var(--glow-cyan); letter-spacing: 10px; animation: glitch 1.5s infinite; }
        .boot-bar { width: 200px; height: 2px; background: rgba(255,255,255,0.1); margin-top: 20px; position: relative; overflow: hidden; }
        .boot-progress { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent-pink); box-shadow: var(--glow-pink); animation: loadBar 2s forwards ease-in-out; }

        /* ==========================================================================
           [5] NAVIGATION HEADER
           ========================================================================== */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; z-index: 5000; transition: all 0.4s ease;
        }

        .brand { display: flex; align-items: center; gap: 15px; }
        .brand-text { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 4px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .sys-controls { display: flex; gap: 15px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 12px; background: rgba(128,128,128,0.1);
            border: 1px solid var(--border-glass); color: var(--text-main);
            display: flex; justify-content: center; align-items: center; font-size: 1.1rem;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .icon-btn:hover { transform: translateY(-3px) rotate(5deg); border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: var(--glow-cyan); }

        /* ==========================================================================
           [6] HERO & STATS SECTION
           ========================================================================== */
        .hero { padding: 160px 40px 60px; text-align: center; position: relative; overflow: hidden; }
        .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900; line-height: 1.1; margin-bottom: 15px; text-transform: uppercase; }
        .hero p { font-family: 'Space Mono', monospace; color: var(--text-dim); font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px; }
        
        .sys-stats { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .stat-badge { padding: 10px 25px; background: rgba(128,128,128,0.05); border: 1px solid var(--border-glass); border-radius: 30px; font-family: 'Space Mono', monospace; font-size: 0.9rem; font-weight: bold; }
        .stat-badge span { color: var(--accent-cyan); }

        /* ==========================================================================
           [7] MASTER GRID (EXTREME PERFORMANCE)
           ========================================================================== */
        .mainframe { max-width: 1800px; margin: 0 auto; padding: 0 40px 100px; }
        
        .grid-matrix {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px;
        }

        .data-node {
            background: var(--bg-surface); border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border-glass); position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: all 0.4s ease;
            transform: translateY(30px); opacity: 0; animation: fadeUp 0.6s forwards ease;
        }
        .data-node:hover { transform: translateY(-8px); border-color: var(--accent-cyan); box-shadow: var(--glow-cyan); }

        .img-container { position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden; cursor: pointer; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s ease, filter 0.5s ease; filter: brightness(0.85); }
        .data-node:hover .img-container img { transform: scale(1.08); filter: brightness(1.1); }
        
        /* Tag Overlays */
        .res-tag { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); padding: 5px 12px; border-radius: 8px; font-family: 'Space Mono', monospace; font-size: 0.75rem; color: #fff; border: 1px solid rgba(255,255,255,0.1); z-index: 10; }

        /* Actions Layer */
        .action-layer { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .action-circle { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; color: #fff; cursor: pointer; transition: 0.3s; }
        
        .action-circle.btn-love:hover, .action-circle.btn-love.active { background: rgba(255,0,85,0.2); border-color: var(--accent-pink); color: var(--accent-pink); box-shadow: var(--glow-pink); transform: scale(1.1); }
        .action-circle.btn-save:hover, .action-circle.btn-save.active { background: rgba(0,243,255,0.2); border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: var(--glow-cyan); transform: scale(1.1); }

        /* Node Info */
        .node-info { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .node-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--text-main); font-weight: 700; }
        .node-meta { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--text-dim); margin-top: 5px; }
        
        .btn-download {
            background: linear-gradient(135deg, var(--accent-cyan), #0088ff);
            color: #000; padding: 10px 20px; border-radius: 12px;
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .btn-download:hover { box-shadow: var(--glow-cyan); transform: scale(1.05); color: #fff; }

        /* Loading Spinner */
        .infinite-spinner { text-align: center; padding: 60px 0; font-family: 'Space Mono', monospace; color: var(--accent-cyan); font-size: 1.2rem; display: none; }
        .infinite-spinner i { animation: spin 1s linear infinite; margin-right: 10px; }

        /* ==========================================================================
           [8] LIGHTBOX MODAL (FULL SCREEN PREVIEW)
           ========================================================================== */
        #lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
            z-index: 100000; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox-close { position: absolute; top: 30px; right: 40px; font-size: 2.5rem; color: #fff; cursor: pointer; transition: 0.3s; }
        .lightbox-close:hover { color: var(--accent-pink); transform: rotate(90deg); }
        #lightbox-img { max-width: 90vw; max-height: 90vh; border-radius: 15px; box-shadow: 0 0 50px rgba(0,243,255,0.2); border: 2px solid rgba(255,255,255,0.1); transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #lightbox.active #lightbox-img { transform: scale(1); }

        /* ==========================================================================
           [9] TOAST NOTIFICATIONS
           ========================================================================== */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: var(--bg-glass); border-left: 4px solid var(--accent-cyan);
            color: var(--text-main); padding: 15px 25px; border-radius: 8px;
            font-family: 'Space Mono', monospace; font-size: 0.9rem; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* ==========================================================================
           [10] SMALL RED TON COFFEE FOOTER
           ========================================================================== */
        .footer-compact {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 4000; display: flex; justify-content: center;
        }
        .ton-red-btn {
            background: rgba(255, 0, 0, 0.1); backdrop-filter: blur(10px);
            border: 1px solid var(--accent-red); padding: 8px 18px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            color: var(--accent-red); font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); transition: all 0.3s ease;
        }
        .ton-red-btn:hover {
            background: rgba(255, 0, 0, 0.25); box-shadow: var(--glow-red); transform: translateY(-3px); color: #fff; border-color: #ff6666;
        }

        /* ==========================================================================
           [11] KEYFRAMES & RESPONSIVE DESIGN
           ========================================================================== */
        @keyframes glitch { 0% { opacity: 1; } 50% { opacity: 0.8; transform: skewX(2deg); } 100% { opacity: 1; } }
        @keyframes loadBar { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            header { padding: 0 20px; height: 70px; }
            .hero h1 { font-size: 2.5rem; }
            .grid-matrix { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); gap: 20px; padding: 0 15px; }
            .mainframe { padding: 0 10px 100px; }
            .footer-compact { width: 90%; bottom: 15px; }
            .ton-red-btn { width: 100%; justify-content: center; font-size: 0.75rem; }
            .cursor-dot, .cursor-ring { display: none; } /* Disable custom cursor on mobile */
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <div id="boot-screen">
        <div class="boot-logo">TOKYO_OS</div>
        <div style="font-family: 'Space Mono'; color: var(--text-dim); margin-top: 10px; font-size: 0.9rem;">INITIALIZING V10.0 ENGINE...</div>
        <div class="boot-bar"><div class="boot-progress"></div></div>
    </div>

    <header>
        <div class="brand">
            <span class="brand-text">PIXEL.DROP</span>
        </div>
        <div class="sys-controls">
            <button class="icon-btn" onclick="toggleTheme()" title="Toggle Matrix Theme"><i class="fas fa-adjust"></i></button>
            <button class="icon-btn" onclick="clearStorage()" title="Clear Memory Cache"><i class="fas fa-trash-alt"></i></button>
            <button class="icon-btn" onclick="window.open('https://instagram.com/i_f_t_uu', '_blank')"><i class="fab fa-instagram"></i></button>
        </div>
    </header>

    <section class="hero">
        <h1>FUTURE VISION <span style="color: var(--accent-pink);">2026</span></h1>
        <p>Advanced Neural Cyberpunk Archive. Accessing secure mainframe for ultra high-resolution assets.</p>
        <div class="sys-stats">
            <div class="stat-badge">ASSETS: <span id="asset-count">0</span> / 500+</div>
            <div class="stat-badge">STATUS: <span>ONLINE</span></div>
            <div class="stat-badge">PING: <span>12ms</span></div>
        </div>
    </section>

    <main class="mainframe">
        <div class="grid-matrix" id="data-grid">
            </div>
        
        <div class="infinite-spinner" id="loading-spinner">
            <i class="fas fa-circle-notch"></i> RENDERING NEXT SECTOR...
        </div>
    </main>

    <div class="footer-compact">
        <button class="ton-red-btn" onclick="copyTonWallet()">
            <i class="fas fa-gem"></i> TON COFFEE: UQCvCMmfwJugAgxbM...
        </button>
    </div>

    <div id="lightbox">
        <i class="fas fa-times lightbox-close" onclick="closeLightbox()"></i>
        <img id="lightbox-img" src="" alt="Full Resolution Preview">
    </div>

    <div id="toast-container"></div>

    <script>
        /* --- 1. CURSOR ENGINE --- */
        const cursorDot = document.getElementById("cursor-dot");
        const cursorRing = document.getElementById("cursor-ring");
        
        window.addEventListener("mousemove", (e) => {
            const posX = e.clientX;
            const posY = e.clientY;
            
            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;
            
            cursorRing.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 150, fill: "forwards" });
        });

        // Hover effect for buttons
        document.querySelectorAll("button, a, .img-container").forEach(el => {
            el.addEventListener("mouseenter", () => {
                cursorRing.style.width = "50px";
                cursorRing.style.height = "50px";
                cursorRing.style.backgroundColor = "rgba(0, 243, 255, 0.1)";
            });
            el.addEventListener("mouseleave", () => {
                cursorRing.style.width = "30px";
                cursorRing.style.height = "30px";
                cursorRing.style.backgroundColor = "transparent";
            });
        });

        /* --- 2. BOOT SEQUENCE --- */
        window.addEventListener("load", () => {
            setTimeout(() => {
                const boot = document.getElementById("boot-screen");
                boot.style.opacity = "0";
                setTimeout(() => boot.style.display = "none", 800);
                showToast("System Online. Mainframe connected.", "success");
            }, 2000);
        });

        /* --- 3. THEME MANAGER --- */
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('tokyoTheme', newTheme);
            showToast(`Theme switched to ${newTheme.toUpperCase()} mode`, "info");
        }
        
        // Load saved theme
        if(localStorage.getItem('tokyoTheme')) {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('tokyoTheme'));
        }

        /* --- 4. TOAST NOTIFICATION ENGINE --- */
        function showToast(message, type = "info") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = "toast";
            
            let icon = "fa-info-circle";
            let color = "var(--accent-cyan)";
            if(type === "success") { icon = "fa-check-circle"; color = "var(--accent-pink)"; }
            if(type === "warning") { icon = "fa-exclamation-triangle"; color = "var(--accent-red)"; }
            
            toast.style.borderLeftColor = color;
            toast.innerHTML = `<i class="fas ${icon}" style="color:${color}; margin-right:10px;"></i> ${message}`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateX(50px)";
                toast.style.transition = "all 0.4s ease";
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        /* --- 5. TON WALLET RED BUTTON SYSTEM --- */
        const TON_WALLET = "UQCvCMmfwJugAgxbMjmUrHI4goe2boXykQwNCDOWcwi8_fGT";
        function copyTonWallet() {
            navigator.clipboard.writeText(TON_WALLET).then(() => {
                showToast("TON Wallet Copied! Thanks for the coffee <3", "success");
            });
        }

        /* --- 6. LOCAL STORAGE DATA MANAGEMENT (Saves Likes & Bookmarks) --- */
        let userLikes = JSON.parse(localStorage.getItem('tokyoLikes')) || [];
        let userSaves = JSON.parse(localStorage.getItem('tokyoSaves')) || [];

        function toggleAction(btn, type, id) {
            const icon = btn.querySelector('i');
            const isActive = btn.classList.contains('active');
            
            if (isActive) {
                btn.classList.remove('active');
                if(type === 'love') {
                    icon.className = 'far fa-heart';
                    userLikes = userLikes.filter(item => item !== id);
                } else {
                    icon.className = 'far fa-bookmark';
                    userSaves = userSaves.filter(item => item !== id);
                }
            } else {
                btn.classList.add('active');
                if(type === 'love') {
                    icon.className = 'fas fa-heart';
                    userLikes.push(id);
                    showToast(`Image ${id} added to Favorites`, "success");
                } else {
                    icon.className = 'fas fa-bookmark';
                    userSaves.push(id);
                    showToast(`Image ${id} Bookmarked securely`, "info");
                }
            }
            
            // Sync with local storage
            localStorage.setItem('tokyoLikes', JSON.stringify(userLikes));
            localStorage.setItem('tokyoSaves', JSON.stringify(userSaves));
        }

        function clearStorage() {
            localStorage.removeItem('tokyoLikes');
            localStorage.removeItem('tokyoSaves');
            userLikes = []; userSaves = [];
            document.querySelectorAll('.action-circle').forEach(btn => {
                btn.classList.remove('active');
                if(btn.classList.contains('btn-love')) btn.querySelector('i').className = 'far fa-heart';
                if(btn.classList.contains('btn-save')) btn.querySelector('i').className = 'far fa-bookmark';
            });
            showToast("Cache Cleared Successfully", "warning");
        }

        /* --- 7. LIGHTBOX (FULLSCREEN) ENGINE --- */
        function openLightbox(imgSrc) {
            const lb = document.getElementById("lightbox");
            const img = document.getElementById("lightbox-img");
            img.src = imgSrc;
            lb.classList.add("active");
        }
        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
        }

        /* --- 8. AI DATA GENERATION (500+ IMAGES ENGINE) --- */
        const TARGET_IMAGES = 505; 
        const BATCH_SIZE = 15;
        let currentLoaded = 0;
        const grid = document.getElementById("data-grid");
        const loader = document.getElementById("loading-spinner");
        const countDisplay = document.getElementById("asset-count");
        
        const sectorNames = ["NEON_CORE", "SHIBUYA_SYS", "AKIHABARA_X", "ROPPONGI_NET", "SHINJUKU_HUB"];

        function loadImages() {
            if(currentLoaded >= TARGET_IMAGES) {
                loader.style.display = "none";
                return;
            }

            loader.style.display = "block";
            const fragment = document.createDocumentFragment();
            let limit = Math.min(currentLoaded + BATCH_SIZE, TARGET_IMAGES);

            for (let i = currentLoaded; i < limit; i++) {
                const imgID = 3000 + i;
                const sector = sectorNames[i % sectorNames.length];
                
                // Generates 4K Cyberpunk Tokyo Images dynamically without API limits
                const prompt = encodeURIComponent("hyperrealistic 8k cyberpunk tokyo neon street night cinematic lighting photography");
                const imgURL = `https://image.pollinations.ai/prompt/${prompt}?width=800&height=1000&nologo=true&seed=${imgID}`;

                const isLiked = userLikes.includes(imgID) ? "active" : "";
                const isSaved = userSaves.includes(imgID) ? "active" : "";
                const heartClass = userLikes.includes(imgID) ? "fas fa-heart" : "far fa-heart";
                const saveClass = userSaves.includes(imgID) ? "fas fa-bookmark" : "far fa-bookmark";

                const node = document.createElement("div");
                node.className = "data-node";
                node.style.animationDelay = `${(i % BATCH_SIZE) * 0.05}s`;

                node.innerHTML = `
                    <div class="img-container" onclick="openLightbox('${imgURL}')">
                        <span class="res-tag">4K RAW</span>
                        <img src="${imgURL}" loading="lazy" alt="Tokyo System Data">
                    </div>
                    
                    <div class="action-layer">
                        <div class="action-circle btn-love ${isLiked}" onclick="toggleAction(this, 'love', ${imgID})">
                            <i class="${heartClass}"></i>
                        </div>
                        <div class="action-circle btn-save ${isSaved}" onclick="toggleAction(this, 'save', ${imgID})">
                            <i class="${saveClass}"></i>
                        </div>
                    </div>

                    <div class="node-info">
                        <div>
                            <div class="node-title">ASSET_${imgID}</div>
                            <div class="node-meta">SECTOR: ${sector} // ONLINE</div>
                        </div>
                        <a href="${imgURL}" target="_blank" download="Tokyo_${imgID}.jpg" class="btn-download" title="Download HQ Image">
                            SAVE
                        </a>
                    </div>
                `;
                fragment.appendChild(node);
            }

            grid.appendChild(fragment);
            currentLoaded = limit;
            countDisplay.innerText = currentLoaded;
            
            // Add custom cursor events to new elements
            document.querySelectorAll(".data-node .img-container, .btn-download, .action-circle").forEach(el => {
                el.addEventListener("mouseenter", () => {
                    cursorRing.style.width = "50px";
                    cursorRing.style.height = "50px";
                    cursorRing.style.backgroundColor = "rgba(255, 0, 85, 0.1)";
                });
                el.addEventListener("mouseleave", () => {
                    cursorRing.style.width = "30px";
                    cursorRing.style.height = "30px";
                    cursorRing.style.backgroundColor = "transparent";
                });
            });
        }

        /* --- 9. INFINITE SCROLL OBSERVER --- */
        const scrollObserver = new IntersectionObserver((entries) => {
            if(entries[0].isIntersecting) {
                setTimeout(loadImages, 500); // 500ms delay for smooth loading feel
            }
        }, { rootMargin: "200px" });

        // Init
        document.addEventListener("DOMContentLoaded", () => {
            loadImages(); // Load initial batch
            scrollObserver.observe(loader);
        });

    </script>
</body>
</html>
