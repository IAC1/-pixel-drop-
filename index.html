<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKYO X - Endless Future</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================================================
           1. ADVANCED CSS VARIABLES & THEME MANAGEMENT
           ========================================================================== */
        :root[data-theme="dark"] {
            --bg-primary: #020203;
            --bg-secondary: rgba(10, 10, 15, 0.85);
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --accent-main: #ff003c;
            --accent-glow: 0 0 25px rgba(255, 0, 60, 0.6);
            --card-bg: #0a0a0f;
            --border-color: rgba(255, 0, 60, 0.15);
            --header-bg: rgba(2, 2, 3, 0.8);
        }

        :root[data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --text-main: #0a0a0f;
            --text-muted: #555c6b;
            --accent-main: #d90033;
            --accent-glow: 0 5px 15px rgba(217, 0, 51, 0.3);
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --header-bg: rgba(255, 255, 255, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }

        body {
            background-color: var(--bg-primary); color: var(--text-main);
            overflow-x: hidden; scroll-behavior: smooth; transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Custom Scrollbar for fast scrolling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-main); border-radius: 4px; }

        /* ==========================================================================
           2. TOP BAR (IG HANDLE) & HEADER
           ========================================================================== */
        .top-bar {
            background: var(--accent-main); color: #fff; text-align: center;
            padding: 5px; font-size: 12px; font-weight: bold; letter-spacing: 2px;
            text-transform: uppercase;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background: var(--header-bg); backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .logo {
            font-family: 'Orbitron', sans-serif; font-size: 35px; font-weight: 900;
            color: var(--accent-main); text-shadow: var(--accent-glow);
            letter-spacing: 5px; cursor: pointer; text-transform: uppercase;
        }

        .nav-controls { display: flex; align-items: center; gap: 15px; }

        .btn-outline, .btn-solid, .icon-btn {
            font-family: 'Rajdhani', sans-serif; font-weight: 700; cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 6px;
        }

        .btn-outline {
            background: transparent; border: 1px solid var(--accent-main);
            color: var(--text-main); padding: 8px 20px;
        }
        .btn-outline:hover { background: var(--accent-main); color: #fff; box-shadow: var(--accent-glow); }

        .btn-solid {
            background: var(--accent-main); border: none; color: #fff;
            padding: 9px 24px; box-shadow: var(--accent-glow);
        }
        .btn-solid:hover { transform: translateY(-2px); filter: brightness(1.2); }

        .icon-btn {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            color: var(--text-main); width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 16px;
        }
        .icon-btn:hover { border-color: var(--accent-main); color: var(--accent-main); transform: rotate(15deg); }

        /* User Profile Badge */
        .user-badge {
            display: none; align-items: center; gap: 10px; background: var(--border-color);
            padding: 5px 15px 5px 5px; border-radius: 30px; border: 1px solid var(--accent-main);
        }
        .user-badge img { width: 30px; height: 30px; border-radius: 50%; }
        .user-badge span { font-family: 'Orbitron'; font-weight: bold; font-size: 14px; }

        /* ==========================================================================
           3. AUTHENTICATION MODALS (LOGIN / SIGNUP)
           ========================================================================== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
            opacity: 0; visibility: hidden; transition: 0.4s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            background: var(--bg-primary); border: 1px solid var(--accent-main);
            padding: 40px; border-radius: 12px; width: 100%; max-width: 400px;
            transform: translateY(50px) scale(0.9); transition: 0.5s; position: relative;
            box-shadow: var(--accent-glow);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

        .close-modal {
            position: absolute; top: 15px; right: 15px; background: none; border: none;
            color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.3s;
        }
        .close-modal:hover { color: var(--accent-main); transform: rotate(90deg); }

        .modal-title { font-family: 'Orbitron'; font-size: 24px; margin-bottom: 25px; text-align: center; color: var(--text-main); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        .form-control {
            width: 100%; padding: 12px 15px; background: var(--bg-secondary);
            border: 1px solid var(--border-color); color: var(--text-main);
            border-radius: 6px; outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--accent-main); box-shadow: inset 0 0 10px rgba(255,0,60,0.2); }
        
        .auth-switch { text-align: center; margin-top: 15px; font-size: 14px; color: var(--text-muted); }
        .auth-switch span { color: var(--accent-main); cursor: pointer; font-weight: bold; }
        .auth-switch span:hover { text-decoration: underline; }

        /* ==========================================================================
           4. LAG-FREE INFINITE GRID SYSTEM
           ========================================================================== */
        .grid-container {
            padding: 40px; max-width: 2000px; margin: 0 auto; min-height: 100vh;
            display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-flow: dense;
        }

        /* Performance Optimizations for "Hazar Hazar" photos */
        .photo-card {
            background: var(--card-bg); border-radius: 10px; overflow: hidden;
            position: relative; border: 1px solid var(--border-color);
            content-visibility: auto; contain-intrinsic-size: 400px;
            will-change: transform; transform: translateZ(0); 
            opacity: 0; animation: fadeIn 0.6s ease forwards;
            height: 400px; display: flex; flex-direction: column;
        }
        
        /* Masonry varied heights */
        .photo-card.tall { height: 600px; grid-row: span 2; }
        .photo-card.wide { grid-column: span 2; }
        @media(max-width: 768px) { .photo-card.wide { grid-column: span 1; } }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .photo-card:hover { border-color: var(--accent-main); transform: translateY(-5px); box-shadow: var(--accent-glow); z-index: 10; }

        .img-wrapper { width: 100%; height: 100%; position: relative; background: #111; overflow: hidden; }
        
        .grid-img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease;
        }
        .photo-card:hover .grid-img { transform: scale(1.1); filter: brightness(0.7) contrast(1.2); }

        .overlay-ui {
            position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 60%);
            opacity: 0; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .photo-card:hover .overlay-ui { opacity: 1; }

        .card-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .action-btn {
            background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2);
            width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s; font-size: 16px;
        }
        .action-btn:hover { border-color: var(--accent-main); color: var(--accent-main); }
        .action-btn.saved { color: var(--accent-main); border-color: var(--accent-main); background: rgba(255,0,60,0.2); }

        .card-info { color: white; transform: translateY(10px); transition: 0.3s; }
        .photo-card:hover .card-info { transform: translateY(0); }
        .card-title { font-family: 'Orbitron'; font-size: 18px; margin-bottom: 5px; text-transform: uppercase; }
        .card-desc { font-size: 13px; color: #aaa; margin-bottom: 15px; }
        
        .download-full {
            width: 100%; padding: 10px; background: transparent; border: 1px solid var(--accent-main);
            color: white; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .download-full:hover { background: var(--accent-main); box-shadow: var(--accent-glow); }

        /* Loader */
        .system-loader { text-align: center; padding: 50px; color: var(--accent-main); font-family: 'Orbitron'; font-size: 20px; letter-spacing: 2px; }

        /* Toasts */
        #toast-container { position: fixed; bottom: 30px; left: 30px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-secondary); border-left: 4px solid var(--accent-main); color: var(--text-main); padding: 15px 25px; border-radius: 4px; border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; font-weight: bold; animation: slideIn 0.3s forwards, fadeOut 0.3s 3s forwards; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(-20px); } }

    </style>
</head>
<body>

    <div class="top-bar">
        Designed By <span style="font-family: 'Orbitron'; color: white;">@i_f_t_uu</span>
    </div>

    <header>
        <div class="logo" onclick="window.scrollTo(0,0)">TOKYO</div>
        
        <div class="nav-controls">
            <button class="icon-btn" id="themeToggle" title="Toggle Dark/Light Mode">
                <i class="fas fa-moon"></i>
            </button>
            
            <div id="auth-buttons">
                <button class="btn-outline" onclick="openModal('loginModal')">LOGIN</button>
                <button class="btn-solid" onclick="openModal('signupModal')">SIGN UP</button>
            </div>

            <div id="user-profile" class="user-badge">
                <img src="https://loremflickr.com/100/100/cyberpunk,avatar" alt="User">
                <span id="username-display">USER_ID</span>
                <button class="icon-btn" style="width: 25px; height: 25px; font-size: 12px; border: none; background: transparent; color: var(--accent-main);" onclick="logout()" title="Logout">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="grid-container" id="gallery-grid">
            </div>
        
        <div id="scroll-target" class="system-loader">
            <i class="fas fa-circle-notch fa-spin"></i> GENERATING NEXT SECTOR...
        </div>
    </main>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('loginModal')"><i class="fas fa-times"></i></button>
            <h2 class="modal-title">SYSTEM LOGIN</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" class="form-control" id="loginUser" required placeholder="Enter your ID">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" required placeholder="Enter encryption key">
                </div>
                <button type="submit" class="btn-solid" style="width: 100%;">ACCESS UPLINK</button>
                <div class="auth-switch">
                    No account? <span onclick="switchModal('loginModal', 'signupModal')">Create one</span>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="signupModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('signupModal')"><i class="fas fa-times"></i></button>
            <h2 class="modal-title">REGISTER IDENTITY</h2>
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Desired Username</label>
                    <input type="text" class="form-control" id="signupUser" required placeholder="Choose an alias">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" required placeholder="System comms link">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" required placeholder="Secure key">
                </div>
                <button type="submit" class="btn-solid" style="width: 100%;">INITIALIZE</button>
                <div class="auth-switch">
                    Already registered? <span onclick="switchModal('signupModal', 'loginModal')">Login here</span>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // --- A. THEME MANAGEMENT (Dark / Light Mode) ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const rootElement = document.documentElement;
        
        // Check saved theme
        if (localStorage.getItem('tokyoTheme') === 'light') {
            rootElement.setAttribute('data-theme', 'light');
            themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = rootElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                rootElement.setAttribute('data-theme', 'light');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                localStorage.setItem('tokyoTheme', 'light');
                showToast('Light Theme Activated');
            } else {
                rootElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                localStorage.setItem('tokyoTheme', 'dark');
                showToast('Dark Theme Activated');
            }
        });

        // --- B. AUTHENTICATION LOGIC (Login / Signup) ---
        function checkAuth() {
            const user = localStorage.getItem('tokyoActiveUser');
            if (user) {
                document.getElementById('auth-buttons').style.display = 'none';
                document.getElementById('user-profile').style.display = 'flex';
                document.getElementById('username-display').innerText = user;
            } else {
                document.getElementById('auth-buttons').style.display = 'flex';
                document.getElementById('user-profile').style.display = 'none';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            localStorage.setItem('tokyoActiveUser', username);
            closeModal('loginModal');
            checkAuth();
            showToast(`Welcome back, ${username}. Uplink secured.`);
            document.getElementById('loginForm').reset();
        }

        function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signupUser').value;
            localStorage.setItem('tokyoActiveUser', username);
            closeModal('signupModal');
            checkAuth();
            showToast(`Identity ${username} registered successfully.`);
            document.getElementById('signupForm').reset();
        }

        function logout() {
            localStorage.removeItem('tokyoActiveUser');
            checkAuth();
            showToast('Connection Terminated. Logged out.');
        }

        // Modal Utility Functions
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function switchModal(closeId, openId) { closeModal(closeId); openModal(openId); }
        
        // Close modal on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('active');
            }
        }

        // --- C. LAG-FREE INFINITE IMAGE GENERATOR (The Magic) ---
        const grid = document.getElementById('gallery-grid');
        let imageCount = 0;
        const BATCH_SIZE = 30; // Loads 30 high-res images per scroll
        
        // Strict Future Architecture Keywords
        const keywords = ['tokyo,cyberpunk,architecture', 'neon,city,future', 'scifi,building,tokyo', 'night,street,japan', 'dystopian,cityscape'];

        function generateUniqueId() { return Math.floor(Math.random() * 90000) + 10000; }

        function loadImages() {
            // Using DocumentFragment prevents reflow/lag when appending thousands of items
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < BATCH_SIZE; i++) {
                imageCount++;
                const word = keywords[Math.floor(Math.random() * keywords.length)];
                const sysId = `SEC-${generateUniqueId()}`;
                
                // Masonry logic for dynamic sizing
                let cardClass = 'photo-card';
                const rand = Math.random();
                if (rand > 0.8) cardClass += ' tall';
                else if (rand > 0.6) cardClass += ' wide';

                const imgUrl = `https://loremflickr.com/800/600/${word}?lock=${imageCount + Math.floor(Math.random() * 10000)}`;

                const card = document.createElement('div');
                card.className = cardClass;
                card.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${imgUrl}" alt="Tokyo Future" class="grid-img" loading="lazy">
                        <div class="overlay-ui">
                            <div class="card-actions">
                                <button class="action-btn" onclick="toggleSave(this)" title="Save to local database">
                                    <i class="far fa-heart"></i>
                                </button>
                                <button class="action-btn" onclick="copyLink('${sysId}')" title="Copy Sector ID">
                                    <i class="fas fa-link"></i>
                                </button>
                            </div>
                            <div class="card-info">
                                <h3 class="card-title">TOKYO // ${sysId}</h3>
                                <p class="card-desc">Architecture / Grid View</p>
                                <button class="download-full" onclick="window.open('${imgUrl}', '_blank')">
                                    <i class="fas fa-expand"></i> VIEW RAW DATA
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            }
            grid.appendChild(fragment);
        }

        // --- D. INTERACTION & NOTIFICATION SYSTEM ---
        function toggleSave(btn) {
            btn.classList.toggle('saved');
            const icon = btn.querySelector('i');
            if (btn.classList.contains('saved')) {
                icon.className = 'fas fa-heart';
                showToast('Image cached to personal drive.');
            } else {
                icon.className = 'far fa-heart';
                showToast('Image removed from cache.');
            }
        }

        function copyLink(id) {
            navigator.clipboard.writeText(`Sector Data: ${id}`);
            showToast(`Sector ${id} copied to clipboard.`);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-check-circle" style="color:var(--accent-main)"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3300);
        }

        // --- E. INTERSECTION OBSERVER (For Unlimited Scrolling without lagging) ---
        // This triggers loadImages() ONLY when the user scrolls near the bottom
        const scrollTarget = document.getElementById('scroll-target');
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                // Set a tiny timeout to simulate network fetching and give DOM time to breathe
                setTimeout(loadImages, 300);
            }
        }, { rootMargin: '1200px' }); // 1200px pre-loads before user even hits the bottom!

        // --- BOOT SEQUENCE ---
        window.onload = () => {
            checkAuth();
            observer.observe(scrollTarget); // Starts the infinite loop
        };

    </script>
</body>
</html>
