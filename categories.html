<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelDrop | Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #1e293b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
    </style>
</head>
<body class="animated-bg min-h-screen text-white font-sans flex flex-col justify-between">

    <nav class="w-full bg-slate-900/60 backdrop-blur-md border-b border-white/10 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-black bg-gradient-to-r from-pink-500 via-purple-400 to-indigo-400 bg-clip-text text-transparent tracking-wider">
                <i class="fa-solid fa-droplet text-pink-500 mr-1"></i>PixelDrop
            </span>
        </div>
        <div class="hidden md:flex space-x-8 font-medium">
            <a href="index.html" class="hover:text-pink-400 transition-all">Home</a>
            <a href="categories.html" class="text-pink-400 border-b-2 border-pink-500 pb-1">Categories</a>
            <a href="popular.html" class="hover:text-pink-400 transition-all">Popular</a>
            <a href="about.html" class="hover:text-pink-400 transition-all">About Us</a>
        </div>
        <button class="bg-gradient-to-r from-pink-500 to-purple-600 px-5 py-2 rounded-full font-semibold shadow-lg text-sm">
            <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload
        </button>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12 w-full flex-grow">
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4 bg-gradient-to-r from-pink-400 to-yellow-300 bg-clip-text text-transparent">Explore Categories</h1>
            <p class="text-gray-400 max-w-md mx-auto text-sm md:text-base">Manusher jonno projoniyo shob chobi alada bhabe khuje pawar digital zone.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="relative rounded-2xl overflow-hidden group h-48 cursor-pointer shadow-lg border border-white/10 hover:border-pink-500/50 transition-all">
                <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/40 to-transparent flex flex-col justify-end p-4">
                    <h3 class="font-bold text-lg">Nature 🌿</h3>
                    <p class="text-xs text-gray-300">1,240+ Images</p>
                </div>
            </div>

            <div class="relative rounded-2xl overflow-hidden group h-48 cursor-pointer shadow-lg border border-white/10 hover:border-purple-500/50 transition-all">
                <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/40 to-transparent flex flex-col justify-end p-4">
                    <h3 class="font-bold text-lg">Wallpapers 🎨</h3>
                    <p class="text-xs text-gray-300">850+ Images</p>
                </div>
            </div>

            <div class="relative rounded-2xl overflow-hidden group h-48 cursor-pointer shadow-lg border border-white/10 hover:border-indigo-500/50 transition-all">
                <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/40 to-transparent flex flex-col justify-end p-4">
                    <h3 class="font-bold text-lg">Minimalist 🤍</h3>
                    <p class="text-xs text-gray-300">620+ Images</p>
                </div>
            </div>

            <div class="relative rounded-2xl overflow-hidden group h-48 cursor-pointer shadow-lg border border-white/10 hover:border-blue-500/50 transition-all">
                <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/40 to-transparent flex flex-col justify-end p-4">
                    <h3 class="font-bold text-lg">Technology 💻</h3>
                    <p class="text-xs text-gray-300">940+ Images</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full bg-slate-950/80 border-t border-white/10 py-6 text-center text-sm text-gray-400">
        <p>&copy; 2026 PixelDrop. Made with ❤️ for everyone.</p>
    </footer>

</body>
</html>
